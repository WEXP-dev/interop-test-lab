name: Self-service request validation

# The unprivileged half of the self-service contour. It holds no secret, mints
# no token, and never executes counterparty code — it reads bytes and computes
# digests. That is why it is safe to run on a pull request from a fork, which is
# the whole point: a counterparty must be able to find out whether their request
# conforms without anyone at WEXP being involved.

on:
  workflow_dispatch:
    inputs:
      request:
        description: Path to the request to validate
        required: true
        default: selfservice/requests/REQUEST-PILOT-001.json
  pull_request:
    paths:
      - 'selfservice/requests/**'

permissions:
  contents: read

concurrency:
  group: selfservice-validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: unprivileged request validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.12'

      - name: Install the one dependency the validator refuses to approximate
        run: python3 -m pip install --quiet jsonschema

      # On a pull request the submitter tells us which request they mean by
      # adding it. Falling back to a fixed default here validated whatever
      # happened to be named in the workflow instead of what was submitted --
      # caught in Pilot-002, where the chain then correctly refused a replay of
      # an already-consumed request. Safe, but the wrong question answered.
      # Exactly one request per submission; zero or several fails closed.
      - name: Resolve the request under validation
        id: req
        shell: bash
        env:
          INPUT_REQUEST: ${{ inputs.request }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_REQUEST:-}" ]; then
            target="$INPUT_REQUEST"
          else
            mapfile -t changed < <(git diff --name-only --diff-filter=AM "$BASE_SHA" HEAD -- 'selfservice/requests/' | sort)
            if [ "${#changed[@]}" -ne 1 ]; then
              echo "::error::a submission must add or modify exactly one request under selfservice/requests/; found ${#changed[@]}"
              printf '  %s\n' "${changed[@]:-(none)}"
              exit 1
            fi
            target="${changed[0]}"
          fi
          [ -f "$target" ] || { echo "::error::no such request: $target"; exit 1; }
          echo "resolved request: $target"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "request_sha256=$(python3 -c "import hashlib,sys;print(hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" "$target")" >> "$GITHUB_OUTPUT"
          echo "commit=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['counterparty']['commit'])" "$target")" >> "$GITHUB_OUTPUT"
          echo "repository=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['counterparty']['repository'])" "$target")" >> "$GITHUB_OUTPUT"

      # Fetched, never executed. The validator reads these bytes to verify the
      # digests the request pinned; nothing in this job runs counterparty code.
      - name: Fetch the pinned counterparty source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.req.outputs.repository }}
          ref: ${{ steps.req.outputs.commit }}
          path: counterparty
          persist-credentials: false

      - name: Validate and emit the receipt
        env:
          PYTHONPATH: selfservice/impl
          PYTHONSAFEPATH: '1'
        run: >-
          python3 -m selfservice.validate_request
          --request "${{ steps.req.outputs.path }}"
          --source-root counterparty/selfservice/pilot-source
          --entrypoint-root counterparty/selfservice/pilot-source
          --receipt build/RECEIPT.json

      - name: Show the receipt
        run: cat build/RECEIPT.json

      # The request bytes travel with the receipt so the trusted side can
      # re-derive everything instead of trusting either of them. Both are
      # untrusted data downstream; carrying them together only saves a lookup.
      - name: Carry the exact request bytes alongside the receipt
        run: cp "${{ steps.req.outputs.path }}" build/REQUEST.json

      - name: Upload the validation receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-receipt
          path: |
            build/RECEIPT.json
            build/REQUEST.json
          if-no-files-found: error
          retention-days: 30
