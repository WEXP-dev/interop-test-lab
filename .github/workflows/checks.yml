name: Disclosure and boundary regressions

# The regression suite for this repository's security properties. It holds no
# secret and touches no private repository, so it is safe to run on a pull
# request from a fork — which is the point: the checks that guard the trust
# boundary must run on exactly the changes most likely to weaken it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    name: disclosure and boundary regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      # The counterparty is public and pinned. It is fetched here so the
      # party-domain reproduction test runs against the real thing rather than
      # against a copy this repository could quietly adjust.
      - name: Fetch the pinned counterparty
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: WEXP-dev/interop-test-subject
          path: subject
          persist-credentials: false

      - name: Verify the counterparty pin
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 -c "import json;print(json.load(open('pins.json'))['subject']['commit'])")"
          observed="$(git -C subject rev-parse HEAD)"
          [ "${observed}" = "${expected}" ] || {
            echo "::error::counterparty pin mismatch: observed ${observed}"; exit 1; }
          echo "counterparty pinned at ${observed}"

      - name: Whitespace and conflict-marker check
        run: git diff --check "$(git rev-list --max-parents=0 HEAD | tail -1)" HEAD

      - name: Regression suite
        run: python3 -m unittest discover -s tests -t tests -p 'test_*.py' -v

      # The repository's own tracked files are held to the same disclosure rules
      # the publication bundle is. A leak committed here is a leak.
      - name: Scan the tracked tree for disclosure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tracked
          git archive HEAD | tar -x -C build/tracked
          python3 tools/disclosure_scan.py \
            --staging build/tracked \
            --allowlist publication/ALLOWLIST.json \
            --families unconditional \
            --exclusions publication/REPOSITORY-SCAN-EXCLUSIONS.json \
            --public-pin "$(python3 -c "import json;print(json.load(open('pins.json'))['subject']['commit'])")" \
            --public-pin "$(python3 -c "import json;print(json.load(open('pins.json'))['wexp_party']['commit'])")" \
            --report build/tracked-scan.json

      - name: Retain the scan reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: disclosure-scan-reports
          path: build/tracked-scan.json
          if-no-files-found: warn
          retention-days: 7
